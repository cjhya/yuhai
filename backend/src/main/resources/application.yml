server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: yuhai-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yuhai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

